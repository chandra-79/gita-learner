<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bhagavad Gita – Learn & Explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#0A1240">

    <style>
        :root {
            --primary:      #1565C0;
            --primary-dark: #0D47A1;
            --accent:       #C9A84C;
            --saffron:      #E65C00;
            --bg:           #FFFBF0;
            --card-bg:      #FFFFFF;
            --sidebar-bg:   #0A1240;
            --sidebar-text: #DDE4FF;
            --sidebar-muted:#7B90CC;
            --text:         #1A1A2E;
            --text-muted:   #6B7280;
            --border:       #E8D5A0;
            --gold:         #C9A84C;
            --radius:       16px;
            --sidebar-w:    290px;
            --shadow:       0 4px 24px rgba(10,18,64,0.09);
            --header-h:     60px;
            --mobile-nav-h: 60px;
        }
        [data-theme="dark"] {
            --bg:       #09111F;
            --card-bg:  #111B2E;
            --sidebar-bg: #060D1A;
            --text:     #E8EBF7;
            --text-muted:#8892B0;
            --border:   #1E2A4A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.7; transition: background 0.3s, color 0.3s;
        }

        /* ── Header ── */
        header {
            position: sticky; top: 0; z-index: 200;
            background: linear-gradient(135deg, #0A1240 0%, #1565C0 100%);
            color: white;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.4rem; height: var(--header-h);
            box-shadow: 0 2px 20px rgba(10,18,64,0.5);
        }
        .header-left { display: flex; align-items: center; gap: 0.85rem; }
        .header-om {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(201,168,76,0.18); border: 1.5px solid rgba(201,168,76,0.55);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; color: #C9A84C; flex-shrink: 0;
            font-family: 'Noto Sans Devanagari', serif;
        }
        .header-title {
            font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #C9A84C);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-subtitle { font-size: 0.7rem; color: rgba(176,196,248,0.8); margin-top: 1px; }
        .header-right { display: flex; gap: 0.4rem; align-items: center; }
        .icon-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer;
            font-size: 0.81rem; display: flex; align-items: center; gap: 4px;
            transition: background 0.15s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.22); }
        #menu-toggle { display: none; }

        /* ── Layout ── */
        .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: calc(100vh - var(--header-h)); }

        /* ── Sidebar ── */
        #sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(201,168,76,0.14);
            display: flex; flex-direction: column; overflow: hidden;
            transition: transform 0.28s ease;
        }
        .sidebar-header {
            padding: 1rem; border-bottom: 1px solid rgba(201,168,76,0.12);
            flex-shrink: 0; background: rgba(0,0,0,0.2);
        }
        .search-wrap { position: relative; }
        .search-wrap input {
            width: 100%; padding: 8px 10px 8px 34px;
            border: 1px solid rgba(201,168,76,0.22); border-radius: 10px;
            background: rgba(255,255,255,0.06); color: var(--sidebar-text);
            font-size: 0.86rem; outline: none; transition: border-color 0.2s;
        }
        .search-wrap input::placeholder { color: var(--sidebar-muted); }
        .search-wrap input:focus { border-color: rgba(201,168,76,0.55); background: rgba(255,255,255,0.09); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.4; color: var(--sidebar-muted); }
        .progress-summary {
            margin-top: 0.65rem; font-size: 0.73rem; color: var(--sidebar-muted);
            display: flex; justify-content: space-between;
        }
        .total-bar { height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-top: 0.4rem; }
        .total-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #FFD54F); border-radius: 2px; transition: width 0.4s; }

        #chapter-list { overflow-y: auto; flex: 1; padding: 0.5rem; }
        #chapter-list::-webkit-scrollbar { width: 3px; }
        #chapter-list::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.22); border-radius: 2px; }
        .chapter-item {
            border-radius: 10px; padding: 0.65rem 0.85rem; cursor: pointer;
            margin-bottom: 2px; transition: all 0.15s; border: 1px solid transparent;
            color: var(--sidebar-text);
        }
        .chapter-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(201,168,76,0.15); }
        .chapter-item.active { background: rgba(201,168,76,0.1); border-color: rgba(201,168,76,0.32); }
        .ch-row { display: flex; justify-content: space-between; align-items: center; }
        .ch-name { font-size: 0.83rem; font-weight: 600; }
        .ch-prog { font-size: 0.68rem; color: var(--sidebar-muted); }
        .ch-subtitle { font-size: 0.69rem; color: var(--sidebar-muted); margin-top: 2px; }
        .mini-bar { height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-top: 5px; }
        .mini-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #FFD54F); border-radius: 2px; transition: width 0.3s; }

        /* Search results */
        .search-results {
            display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
            background: #162040; border: 1px solid rgba(201,168,76,0.25);
            border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.45); z-index: 100;
            max-height: 280px; overflow-y: auto;
        }
        .search-results.show { display: block; }
        .sr-item {
            padding: 0.55rem 0.9rem; cursor: pointer; font-size: 0.82rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.1s;
            color: var(--sidebar-text);
        }
        .sr-item:last-child { border-bottom: none; }
        .sr-item:hover { background: rgba(255,255,255,0.06); }

        /* ── Main ── */
        #main { overflow-y: auto; padding: 1.4rem; scroll-behavior: smooth; }

        /* Daily verse */
        #daily-verse {
            background: linear-gradient(135deg, #EEF2FF, #E3F2FD);
            border: 1px solid rgba(21,101,192,0.18); border-radius: var(--radius);
            padding: 1rem 1.3rem; margin-bottom: 1.4rem;
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            position: relative; overflow: hidden;
        }
        [data-theme="dark"] #daily-verse {
            background: linear-gradient(135deg, #0D1B4B, #0F1E40);
            border-color: rgba(201,168,76,0.18);
        }
        #daily-verse::after {
            content: 'ॐ'; position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%);
            font-size: 4.5rem; opacity: 0.06; color: #1565C0; pointer-events: none;
            font-family: 'Noto Sans Devanagari', serif;
        }
        [data-theme="dark"] #daily-verse::after { color: var(--gold); opacity: 0.09; }
        .daily-label { font-size: 0.67rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        [data-theme="dark"] .daily-label { color: var(--gold); }
        .daily-text { font-size: 0.92rem; margin-top: 2px; }
        .daily-btn {
            margin-left: auto; background: var(--primary); color: white; border: none;
            padding: 7px 16px; border-radius: 10px; cursor: pointer; font-size: 0.82rem;
            white-space: nowrap; font-weight: 500; transition: background 0.15s;
        }
        .daily-btn:hover { background: var(--primary-dark); }

        /* Chapter header */
        .ch-header-card {
            background: linear-gradient(135deg, #0A1240 0%, #1565C0 65%, #1976D2 100%);
            color: white; border-radius: var(--radius); padding: 1.8rem 2rem; margin-bottom: 1.4rem;
            position: relative; overflow: hidden;
        }
        .ch-header-card::before {
            content: ''; position: absolute; right: -3rem; top: -3rem;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 65%);
            border-radius: 50%; pointer-events: none;
        }
        .ch-header-card h2 { font-family: 'Cinzel', serif; font-size: 1.42rem; position: relative; }
        .ch-header-card p { opacity: 0.72; margin-top: 0.4rem; font-size: 0.88rem; position: relative; }

        /* Verse card */
        .verse-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.8rem;
            margin-bottom: 1.4rem; box-shadow: var(--shadow);
            border-top: 3px solid var(--gold);
        }
        .verse-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 1.4rem; flex-wrap: wrap; gap: 0.6rem;
        }
        .verse-label { font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--primary); font-weight: 700; }
        [data-theme="dark"] .verse-label { color: var(--gold); }
        .verse-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

        /* Buttons */
        .btn {
            border: none; border-radius: 9px; cursor: pointer;
            padding: 6px 14px; font-size: 0.79rem; transition: all 0.15s;
            white-space: nowrap; font-weight: 500;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.3; cursor: default; transform: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-read { background: #E8F5E9; color: #2E7D32; border: 1px solid #C8E6C9; }
        .btn-read-done { background: #2E7D32; color: white; }
        .btn-bm { background: #FFF8E1; color: #E65100; border: 1px solid #FFE082; }
        .btn-bm-done { background: linear-gradient(135deg, var(--gold), #FFB300); color: white; }

        /* Sanskrit block */
        .sanskrit-block {
            background: linear-gradient(135deg, #EEF2FF, #F0F4FF);
            border-left: 4px solid var(--gold); border-radius: 0 12px 12px 0;
            padding: 1.2rem 1.5rem; margin-bottom: 0.6rem;
        }
        [data-theme="dark"] .sanskrit-block {
            background: linear-gradient(135deg, rgba(13,27,75,0.5), rgba(21,101,192,0.08));
        }
        .sanskrit-text {
            font-family: 'Noto Sans Devanagari', serif;
            font-size: 1.48rem; line-height: 2.1; color: var(--primary-dark); white-space: pre-line;
        }
        [data-theme="dark"] .sanskrit-text { color: #90CAF9; }
        .translit-text {
            font-style: italic; color: var(--text-muted);
            margin-top: 0.5rem; font-size: 0.9rem; white-space: pre-line;
            border-top: 1px solid var(--border); padding-top: 0.5rem;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin: 1.4rem 0 0.8rem; }
        .tab {
            padding: 7px 18px; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; font-size: 0.86rem;
            border-bottom: 3px solid transparent; margin-bottom: -2px;
            transition: all 0.15s; border-radius: 8px 8px 0 0; font-weight: 500;
        }
        .tab:hover { color: var(--text); background: rgba(0,0,0,0.03); }
        .tab.active { color: var(--primary); border-bottom-color: var(--gold); font-weight: 600; }
        [data-theme="dark"] .tab.active { color: var(--gold); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .trans-text { font-size: 0.97rem; line-height: 1.85; }
        .telugu-text { font-family: 'Noto Sans Telugu', sans-serif; font-size: 1.06rem; line-height: 2.1; }
        .empty-trans {
            color: var(--text-muted); font-style: italic; padding: 1.1rem;
            background: var(--bg); border-radius: 10px; text-align: center; font-size: 0.86rem;
            border: 1px dashed var(--border);
        }

        /* Word by word */
        .wbw-section { margin-top: 1.4rem; }
        .wbw-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.55rem; font-weight: 600; }
        .wbw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .wbw-chip {
            background: linear-gradient(135deg, #EEF2FF, #F3F4FF);
            border: 1px solid rgba(21,101,192,0.14);
            border-radius: 20px; padding: 3px 11px; font-size: 0.79rem; line-height: 1.6;
            transition: all 0.15s; cursor: default;
        }
        .wbw-chip:hover { background: var(--primary); color: white; border-color: transparent; }
        [data-theme="dark"] .wbw-chip { background: rgba(21,101,192,0.14); border-color: rgba(21,101,192,0.28); }

        /* Verse nav */
        .verse-nav {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--border); gap: 0.5rem;
        }
        .verse-nav-info { font-size: 0.8rem; color: var(--text-muted); text-align: center; line-height: 1.5; }

        /* Toast */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #0A1240, #1565C0); color: #fff;
            padding: 0.55rem 1.5rem; border-radius: 24px; font-size: 0.85rem; z-index: 999;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
            box-shadow: 0 4px 20px rgba(10,18,64,0.4);
            border: 1px solid rgba(201,168,76,0.3);
        }
        #toast.show { opacity: 1; }

        /* ── Mobile bottom nav ── */
        .mobile-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sidebar-bg);
            border-top: 1px solid rgba(201,168,76,0.18);
            padding: 0.45rem 0 calc(0.45rem + env(safe-area-inset-bottom));
            z-index: 190; justify-content: space-around; align-items: center;
            height: var(--mobile-nav-h);
        }
        .mobile-nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: none; border: none; color: var(--sidebar-muted);
            font-size: 0.58rem; cursor: pointer; padding: 4px 14px;
            border-radius: 10px; transition: color 0.15s; letter-spacing: 0.3px;
        }
        .mobile-nav-btn .nav-icon { font-size: 1.3rem; line-height: 1; }
        .mobile-nav-btn:hover { color: var(--gold); }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
                height: calc(100vh - var(--header-h) - var(--mobile-nav-h));
            }
            #sidebar {
                position: fixed; left: 0; top: var(--header-h);
                bottom: var(--mobile-nav-h); width: min(var(--sidebar-w), 88vw);
                z-index: 150; transform: translateX(-100%);
            }
            #sidebar.open { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,0,0,0.55); }
            #menu-toggle { display: flex; }
            .header-subtitle { display: none; }
            .verse-card { padding: 1.2rem; }
            .sanskrit-text { font-size: 1.22rem; }
            .ch-header-card { padding: 1.3rem 1.4rem; }
            .ch-header-card h2 { font-size: 1.2rem; }
            .mobile-nav { display: flex; }
            #main { padding: 1rem; }
            #toast { bottom: calc(var(--mobile-nav-h) + 0.6rem); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="icon-btn" id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="header-om">ॐ</div>
        <div>
            <div class="header-title">Bhagavad Gita</div>
            <div class="header-subtitle">भगवद्गीता &nbsp;·&nbsp; భగవద్గీత</div>
        </div>
    </div>
    <div class="header-right">
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode">🌓</button>
        <button class="icon-btn" onclick="showBookmarks()" title="Bookmarks">🔖 <span id="bm-count">0</span></button>
        <button class="icon-btn" onclick="exportData()" title="Export progress">💾</button>
    </div>
</header>

<div class="layout">
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="Search verses… (press '/')" autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
            <div class="progress-summary">
                <span id="prog-label">0 / 701 verses read</span>
                <span id="prog-pct">0%</span>
            </div>
            <div class="total-bar"><div class="total-bar-fill" id="total-bar" style="width:0%"></div></div>
        </div>
        <div id="chapter-list"></div>
    </aside>

    <main id="main">
        <div id="daily-verse"></div>
        <div id="app"></div>
    </main>
</div>

<nav class="mobile-nav">
    <button class="mobile-nav-btn" onclick="toggleSidebar()">
        <span class="nav-icon">📚</span>Chapters
    </button>
    <button class="mobile-nav-btn" onclick="mobileSearch()">
        <span class="nav-icon">🔍</span>Search
    </button>
    <button class="mobile-nav-btn" onclick="showBookmarks()">
        <span class="nav-icon">🔖</span>Saved
    </button>
    <button class="mobile-nav-btn" onclick="toggleTheme()">
        <span class="nav-icon">🌓</span>Theme
    </button>
</nav>

<div id="toast"></div>

<script src="data.js"></script>
<script>
const CHAPTER_NAMES = [
    "",
    "Arjuna Vishada Yoga",
    "Sankhya Yoga",
    "Karma Yoga",
    "Jnana Karma Sannyasa Yoga",
    "Karma Sannyasa Yoga",
    "Atma Samyama Yoga",
    "Jnana Vijnana Yoga",
    "Akshara Brahma Yoga",
    "Raja Vidya Raja Guhya Yoga",
    "Vibhuti Yoga",
    "Vishvarupa Darshana Yoga",
    "Bhakti Yoga",
    "Kshetra Kshetrajna Vibhaga Yoga",
    "Gunatraya Vibhaga Yoga",
    "Purushottama Yoga",
    "Daivasura Sampad Vibhaga Yoga",
    "Shraddhatraya Vibhaga Yoga",
    "Moksha Sannyasa Yoga"
];

const state = {
    ch: 1, v: 1, tab: "english",
    progress: JSON.parse(localStorage.getItem("gita_progress") || "{}"),
    bookmarks: new Set(JSON.parse(localStorage.getItem("gita_bookmarks") || "[]")),
    dark: localStorage.getItem("gita_theme") === "dark"
};

// ── Lookups ──
const byChapter = {};
for (const v of GITA) {
    if (!byChapter[v.chapter]) byChapter[v.chapter] = [];
    byChapter[v.chapter].push(v);
}
function getVerse(ch, v) { return (byChapter[ch] || []).find(x => x.verse === v); }
function chVerses(ch) { return byChapter[ch] || []; }
function totalRead() { return Object.keys(state.progress).length; }

// ── Toast ──
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove("show"), 2200);
}

// ── Tab switching ──
function setTab(name) {
    state.tab = name;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.dataset.tab === name));
}

// ── Sidebar ──
function renderSidebar() {
    const total = GITA.length;
    const read = totalRead();
    const pct = Math.round(read / total * 100);
    document.getElementById("prog-label").textContent = `${read} / ${total} verses read`;
    document.getElementById("prog-pct").textContent = `${pct}%`;
    document.getElementById("total-bar").style.width = pct + "%";
    document.getElementById("bm-count").textContent = state.bookmarks.size;

    let html = "";
    for (let i = 1; i <= 18; i++) {
        const vs = chVerses(i);
        const done = vs.filter(x => state.progress[`${i}_${x.verse}`]).length;
        const p = vs.length ? Math.round(done / vs.length * 100) : 0;
        html += `<div class="chapter-item ${state.ch === i ? "active" : ""}" onclick="loadChapter(${i})">
            <div class="ch-row"><span class="ch-name">Ch ${i}</span><span class="ch-prog">${done}/${vs.length}</span></div>
            <div class="ch-subtitle">${CHAPTER_NAMES[i]}</div>
            <div class="mini-bar"><div class="mini-fill" style="width:${p}%"></div></div>
        </div>`;
    }
    document.getElementById("chapter-list").innerHTML = html;
}

// ── Daily Verse ──
function renderDailyVerse() {
    const seed = new Date().toDateString().split("").reduce((a, b) => a + b.charCodeAt(0), 0);
    const dv = GITA[seed % GITA.length];
    const snippet = dv.transliteration.split("\n")[0].slice(0, 60);
    document.getElementById("daily-verse").innerHTML = `
        <div style="flex:1;min-width:0">
            <div class="daily-label">✨ Verse of the Day</div>
            <div class="daily-text">Ch ${dv.chapter} · ${dv.verse} &nbsp;—&nbsp; <em>${snippet}…</em></div>
        </div>
        <button class="daily-btn" onclick="loadVerse(${dv.chapter},${dv.verse})">Read →</button>`;
}

// ── Chapter view ──
function loadChapter(ch) {
    state.ch = ch; state.v = 1;
    renderSidebar();
    const vs = chVerses(ch);
    const done = vs.filter(x => state.progress[`${ch}_${x.verse}`]).length;
    const pct = vs.length ? Math.round(done / vs.length * 100) : 0;
    document.getElementById("app").innerHTML = `
        <div class="ch-header-card">
            <h2>Chapter ${ch}: ${CHAPTER_NAMES[ch]}</h2>
            <p>${vs.length} verses &nbsp;·&nbsp; ${done} read (${pct}%)</p>
        </div>
        <div id="verse-area"></div>`;
    loadVerseArea(ch, 1);
    document.getElementById("main").scrollTo(0, 0);
    if (window.innerWidth <= 768) closeSidebar();
}

// ── Single verse navigation entry ──
function loadVerse(ch, v) {
    state.ch = ch; state.v = v;
    renderSidebar();
    const vs = chVerses(ch);
    const done = vs.filter(x => state.progress[`${ch}_${x.verse}`]).length;
    const pct = vs.length ? Math.round(done / vs.length * 100) : 0;
    document.getElementById("app").innerHTML = `
        <div class="ch-header-card">
            <h2>Chapter ${ch}: ${CHAPTER_NAMES[ch]}</h2>
            <p>${vs.length} verses &nbsp;·&nbsp; ${done} read (${pct}%)</p>
        </div>
        <div id="verse-area"></div>`;
    loadVerseArea(ch, v);
    document.getElementById("main").scrollTo(0, 0);
    if (window.innerWidth <= 768) closeSidebar();
}

// ── Render verse into #verse-area without full page rebuild ──
function loadVerseArea(ch, v) {
    state.ch = ch; state.v = v;
    const verse = getVerse(ch, v);
    if (!verse) return;

    const key = `${ch}_${v}`;
    const isRead = !!state.progress[key];
    const isBm = state.bookmarks.has(key);
    const vs = chVerses(ch);
    const idx = vs.findIndex(x => x.verse === v);
    const prevV = idx > 0 ? vs[idx - 1] : null;
    const nextV = idx < vs.length - 1 ? vs[idx + 1] : null;
    const globalIdx = GITA.findIndex(x => x.chapter === ch && x.verse === v);

    const englishHtml = verse.translation
        ? `<p class="trans-text">${verse.translation}</p>`
        : `<div class="empty-trans">📜 English translation coming soon.</div>`;

    const teluguHtml = verse.telugu
        ? `<p class="trans-text telugu-text">${verse.telugu}</p>`
        : `<div class="empty-trans">📜 తెలుగు అనువాదం త్వరలో అందుబాటులోకి వస్తుంది.</div>`;

    const hindiHtml = verse.hindi
        ? `<p class="trans-text">${verse.hindi}</p>`
        : `<div class="empty-trans">📜 हिंदी अनुवाद शीघ्र उपलब्ध होगा।</div>`;

    const wbwHtml = verse.word_by_word && verse.word_by_word.length
        ? `<div class="wbw-section">
               <div class="wbw-label">Word by Word</div>
               <div class="wbw-chips">${verse.word_by_word.map(w => `<span class="wbw-chip">${w}</span>`).join("")}</div>
           </div>`
        : "";

    const t = state.tab;

    const area = document.getElementById("verse-area");
    if (!area) return;
    area.innerHTML = `
    <div class="verse-card">
        <div class="verse-header">
            <div class="verse-label">Chapter ${ch} · Verse ${v}</div>
            <div class="verse-actions">
                <button class="btn ${isBm ? "btn-bm-done" : "btn-bm"}" onclick="toggleBookmark(${ch},${v})">${isBm ? "🔖 Saved" : "🔖 Save"}</button>
                <button class="btn ${isRead ? "btn-read-done" : "btn-read"}" onclick="toggleRead(${ch},${v})">${isRead ? "✅ Read" : "📖 Mark Read"}</button>
                <button class="btn btn-ghost" onclick="shareVerse(${ch},${v})">📤</button>
            </div>
        </div>

        <div class="sanskrit-block">
            <div class="sanskrit-text">${verse.sanskrit}</div>
            <div class="translit-text">${verse.transliteration}</div>
        </div>

        <div class="tabs">
            <button class="tab ${t==="english"?"active":""}" data-tab="english" onclick="setTab('english')">English</button>
            <button class="tab ${t==="telugu"?"active":""}" data-tab="telugu" onclick="setTab('telugu')">తెలుగు</button>
            <button class="tab ${t==="hindi"?"active":""}" data-tab="hindi" onclick="setTab('hindi')">हिंदी</button>
        </div>
        <div class="tab-panel ${t==="english"?"active":""}" data-tab="english">${englishHtml}</div>
        <div class="tab-panel ${t==="telugu"?"active":""}" data-tab="telugu">${teluguHtml}</div>
        <div class="tab-panel ${t==="hindi"?"active":""}" data-tab="hindi">${hindiHtml}</div>

        ${wbwHtml}

        <div class="verse-nav">
            <button class="btn btn-ghost" onclick="${prevV ? `loadVerseArea(${ch},${prevV.verse})` : ch > 1 ? `loadChapterLast(${ch-1})` : ""}"
                ${!prevV && ch <= 1 ? "disabled" : ""}>
                ← ${prevV ? `V ${prevV.verse}` : ch > 1 ? `Ch ${ch-1}` : ""}
            </button>
            <div class="verse-nav-info">
                Verse ${v} of ${vs.length}<br>
                <small>#${globalIdx + 1} of ${GITA.length}</small>
            </div>
            <button class="btn btn-primary" onclick="${nextV ? `loadVerseArea(${ch},${nextV.verse})` : ch < 18 ? `loadChapter(${ch+1})` : ""}"
                ${!nextV && ch >= 18 ? "disabled" : ""}>
                ${nextV ? `V ${nextV.verse}` : ch < 18 ? `Ch ${ch+1}` : ""} →
            </button>
        </div>
    </div>`;
}

function loadChapterLast(ch) {
    const vs = chVerses(ch);
    loadVerse(ch, vs[vs.length - 1].verse);
}

// ── Keyboard navigation ──
function navigateVerse(dir) {
    const vs = chVerses(state.ch);
    const idx = vs.findIndex(x => x.verse === state.v);
    if (dir === 1) {
        if (idx < vs.length - 1) loadVerseArea(state.ch, vs[idx + 1].verse);
        else if (state.ch < 18) loadChapter(state.ch + 1);
    } else {
        if (idx > 0) loadVerseArea(state.ch, vs[idx - 1].verse);
        else if (state.ch > 1) loadChapterLast(state.ch - 1);
    }
}

// ── Progress & Bookmarks ──
function toggleRead(ch, v) {
    const key = `${ch}_${v}`;
    if (state.progress[key]) delete state.progress[key]; else state.progress[key] = true;
    localStorage.setItem("gita_progress", JSON.stringify(state.progress));
    renderSidebar(); loadVerseArea(ch, v);
}

function toggleBookmark(ch, v) {
    const key = `${ch}_${v}`;
    if (state.bookmarks.has(key)) { state.bookmarks.delete(key); toast("Bookmark removed"); }
    else { state.bookmarks.add(key); toast("Bookmarked!"); }
    localStorage.setItem("gita_bookmarks", JSON.stringify([...state.bookmarks]));
    renderSidebar(); loadVerseArea(ch, v);
}

function showBookmarks() {
    if (!state.bookmarks.size) { toast("No bookmarks yet"); return; }
    document.getElementById("app").innerHTML = `
        <div class="verse-card">
            <div class="verse-header"><div class="verse-label">🔖 Bookmarks (${state.bookmarks.size})</div></div>
            ${[...state.bookmarks].map(k => {
                const [ch, v] = k.split("_").map(Number);
                return `<div class="sr-item" onclick="loadVerse(${ch},${v})" style="border-radius:8px;margin-bottom:4px;border:1px solid var(--border);color:var(--text)">
                    <strong>Ch ${ch} · ${v}</strong> — ${CHAPTER_NAMES[ch]}</div>`;
            }).join("")}
        </div>`;
    if (window.innerWidth <= 768) closeSidebar();
}

// ── Share ──
function shareVerse(ch, v) {
    const verse = getVerse(ch, v);
    if (!verse) return;
    const text = `Bhagavad Gita Ch ${ch}·${v}\n\n${verse.sanskrit}\n\n${verse.transliteration}`;
    if (navigator.share) navigator.share({ title: `Gita ${ch}:${v}`, text });
    else navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard!"));
}

// ── Export ──
function exportData() {
    const out = { progress: state.progress, bookmarks: [...state.bookmarks], exported: new Date().toISOString() };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
    a.download = "gita_backup.json"; a.click();
    toast("Progress exported!");
}

// ── Search ──
let debounce;
document.getElementById("search").addEventListener("input", e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => doSearch(e.target.value.trim()), 180);
});
document.getElementById("search").addEventListener("blur", () => {
    setTimeout(() => document.getElementById("search-results").classList.remove("show"), 200);
});

function doSearch(q) {
    const res = document.getElementById("search-results");
    if (!q || q.length < 2) { res.classList.remove("show"); return; }
    const ql = q.toLowerCase();
    const hits = GITA.filter(v =>
        (v.transliteration && v.transliteration.toLowerCase().includes(ql)) ||
        (v.translation && v.translation.toLowerCase().includes(ql)) ||
        (v.word_by_word && v.word_by_word.some(w => w.toLowerCase().includes(ql)))
    ).slice(0, 10);
    if (!hits.length) {
        res.innerHTML = `<div class="sr-item" style="color:var(--sidebar-muted)">No results</div>`;
    } else {
        res.innerHTML = hits.map(v =>
            `<div class="sr-item" onclick="loadVerse(${v.chapter},${v.verse})">
                <strong>Ch ${v.chapter}·${v.verse}</strong> — ${v.transliteration.split("\n")[0].slice(0, 55)}…
             </div>`).join("");
    }
    res.classList.add("show");
}

// ── Theme ──
function toggleTheme() {
    state.dark = !state.dark;
    document.body.setAttribute("data-theme", state.dark ? "dark" : "light");
    localStorage.setItem("gita_theme", state.dark ? "dark" : "light");
}

// ── Sidebar mobile ──
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }
function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); }
function mobileSearch() {
    document.getElementById("sidebar").classList.add("open");
    setTimeout(() => document.getElementById("search").focus(), 280);
}

// ── Keyboard shortcuts ──
window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "/") { e.preventDefault(); document.getElementById("search").focus(); }
    if (e.key === "ArrowRight") navigateVerse(1);
    if (e.key === "ArrowLeft") navigateVerse(-1);
    if (e.key === "Escape") closeSidebar();
});

// ── Service Worker ──
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// ── Init ──
function init() {
    if (state.dark) document.body.setAttribute("data-theme", "dark");
    renderDailyVerse();
    renderSidebar();
    loadChapter(1);
}
init();
</script>
