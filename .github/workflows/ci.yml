name: Verify site

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check build_gita.mjs
      - run: node --check generate-data.mjs
      - run: node --check sw.js
      - run: npm audit --audit-level=high
